<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artworks</title>

  <!-- ✅ 공통 (헤더/폰트 스타일 유지) -->
  <link rel="stylesheet" href="../front/styles.css" />
  <link rel="stylesheet" href="../front/header.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- ✅ 페이지 전용 (공통보다 뒤) -->
  <link rel="preload" href="./artworks.css" as="style" />
  <link rel="stylesheet" href="./artworks.css" />
  
  <!-- Cart drawer styles (for consistent look when cart opens from hearts) -->
  <link rel="stylesheet" href="/front/cart.css">
  <!-- Heart effects (blue 3D-ish heart, sparkles, smoke) -->
  <link rel="stylesheet" href="./heartFX.css"><!-- or /Front/HeartFX.css -->
  
  <meta name="theme-color" content="#010102" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#010102">
</head>
<body data-page="artworks">
  <!-- ✅ 공통 헤더 주입 -->
  <div data-include="header"></div>
  <div data-include="cart"></div>

  <!-- 페이지 콘텐츠 -->
  <main id="section2" class="s2">
    <div class="s2__toolbar" role="search">
      <input id="q" class="s2__search" type="search" placeholder="Search title, tags, medium" />
      <select id="year" class="s2__select"><option value="">All Years</option></select>
      <select id="medium" class="s2__select"><option value="">All Media</option></select>
      <select id="sort" class="s2__select">
        <option value="new">Newest</option><option value="old">Oldest</option>
        <option value="az">A–Z</option><option value="za">Z–A</option>
        <option value="featured">Featured first</option>
      </select>
    </div>

    <!-- ✅ 활성 필터칩 (추가) -->
    <div id="active-filters" class="s2__active-filters" hidden></div>

    <section id="grid" class="s2__grid" aria-live="polite"></section>
    <div id="empty" class="s2__empty" hidden><p></p></div>
    

    <div id="pwModal" class="pw-modal" hidden>
      <div class="pw-wrap">
        <button class="pw-close">×</button>
        <h2>Enter Password</h2>

        <input id="pwInput" type="password" placeholder="Password" />
        <p id="pwError" class="pw-error" hidden>*Incorrect password</p>

        <div id="pw-btn-group">
          <button id="pwSubmit">Enter</button>
          <button id="pwCancel">Cancel</button>
        </div>

      </div>
    </div>
  </main>

  <template id="card-tpl">
    <article class="card card--overlay">
      <a class="card__media" href="#">
        <img class="card__img" alt="" loading="lazy" />
          <div class="featured-badge" hidden>✴︎</div>
      </a>
      <div class="card__body">
        <h3 class="card__title"></h3>
        <div class="card__meta">
          <span class="card__year"></span><span class="card__dot">•</span><span class="card__medium"></span>
        </div>
        <div class="card__tags"></div>
      </div>
    </article>
  </template>

<!-- three.js import map -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./heartFX.js"></script>
<script type="module" src="./artworks.js"></script>
<script type="module" src="/front/cart.js"></script>
<script src="../front/headerLoader.js" defer></script>
<script defer src="/front/favicons.js"></script>
</body>
</html>
