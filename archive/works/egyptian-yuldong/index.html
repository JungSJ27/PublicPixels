    <!-- Project description -->
    <section class="ey-section ey-text" aria-label="Project description">
      <h1 class="ey-title">Egyptian Yuldong</h1>

      <div class="ey-paras">
        <p>
          Egyptian Yuldong은 일상 속 이동과 임시 구조물, 그리고 리듬처럼 반복되는 도상들을 한 화면 안에서 재조립하는 프로젝트다.
          서로 다른 색의 바탕 위에서 인물과 오브젝트가 교차하고, 패턴은 서사의 배경이자 또 다른 장면으로 기능한다.
        </p>
        <p>
          이미지들은 단일한 결론으로 닫히기보다, 복수의 버전으로 변주되며 축제의 감각과 이동의 감각을 동시에 남긴다.
          아래의 시퀀스는 그 변주의 흐름을 페이지의 리듬으로 번역한 구성이다.
        </p>
      </div>
    </section>
