<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mong | Archive</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="/front/styles.css">
  <link rel="stylesheet" href="/front/header.css">

  <!-- Page CSS -->
  <link rel="stylesheet" href="mong.css">

  <!-- model-viewer (한 번만) -->
  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <!-- Header Loader -->
  <script src="/front/headerLoader.js" defer></script>

  <!-- Page JS -->
  <script type="module" src="mong.js"></script>
</head>


<body data-page="log">

  <!-- HEADER INCLUDE -->
  <div data-include="header"></div>

  <!-- LIST BUTTON -->
  <div class="list-toggle" onclick="location.href='/archive/'">
    <svg viewBox="0 0 24 24" class="ic-list">
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <line x1="4" y1="6"  x2="20" y2="6"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="18" x2="20" y2="18"/>
      </g>
    </svg>
  </div>

  <main class="mong_main">

  <!-- INTRO -->
  <section class="mong-head">
    <div class="mong-title">
      <h1>Mong</h1>
      <div class="mong-meta">
        <div>2022</div>
        <div>Digital illustration, Pattern and Textile design</div>
      </div>
    </div>

    <div class="mong-desc">
      <p>A dreamy butterfly pattern series with a hazy aftertaste, like a late night martini.</p>
      <p class="kor">나비를 몽환적으로 풀어낸 패턴 시리즈. 밤에 마티니 한 잔을 마신 듯한 몽롱한 잔향을 표현했다.</p>
    </div>
  </section>

  <!-- GRID -->
  <section class="mong-grid-wrap">
    <div class="mong-pattern" id="mongPattern"></div>
  </section>

      <!-- 캡션 복구 -->
      <div class="mong-captions" id="mongCaptions">
        <p class="cap-text" id="cap1"></p>
        <p class="cap-text" id="cap2"></p>
        <p class="cap-text" id="cap3"></p>
      </div>
    </section>


  </main>

  <script defer src="/front/favicons.js"></script>
</body>
</html>
