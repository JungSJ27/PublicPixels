<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Butterfly Trap | Archive</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="/front/styles.css">
  <link rel="stylesheet" href="/front/header.css">

  <!-- Page CSS -->
  <link rel="stylesheet" href="mong.css">

  <!-- model-viewer (한 번만) -->
  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <!-- Header Loader -->
  <script src="/front/headerLoader.js" defer></script>

  <!-- Page JS -->
  <script type="module" src="mong.js"></script>
</head>


<body data-page="log">

  <!-- HEADER INCLUDE -->
  <div data-include="header"></div>

  <!-- LIST BUTTON -->
  <div class="list-toggle" onclick="location.href='/archive/'">
    <svg viewBox="0 0 24 24" class="ic-list">
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <line x1="4" y1="6"  x2="20" y2="6"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="18" x2="20" y2="18"/>
      </g>
    </svg>
  </div>

  <main class="mong_main">

    <!-- INTRO -->
    <section class="mong_intro">
      <div class="intro_title_col">
        <h1 class="mong_title">Mong</h1>
        <p class="mong_subtitle">K-Toile de Jouy</p>
      </div>

      <div class="intro_text_col">
        <p class="mong_desc">
          A pattern project inspired by Korean narrative imagery.
        </p>
        <p class="mong_desc muted">
          Traditional motifs translated into a continuous decorative surface.
        </p>
      </div>
    </section>

    <!-- PATTERN GRID -->
    <section class="mong_pattern" id="mongPattern">
      <!-- JS가 mong1~mong9 자동 삽입 -->
    </section>

    <!-- PATTERN CAPTIONS -->
    <section class="pattern-captions">
      <p class="cap-text">K-Toile de Jouy</p>
      <p class="cap-text">Saekdong Palette</p>
      <p class="cap-text">Korean Narrative Pattern</p>
    </section>

  </main>

  <script defer src="/front/favicons.js"></script>
</body>
</html>
