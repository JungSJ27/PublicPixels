<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAKWON | Archive</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="/front/styles.css" />
  <link rel="stylesheet" href="/front/header.css" />

  <!-- Page CSS -->
  <link rel="stylesheet" href="nakwon.css" />

  <!-- Header Loader -->
  <script src="/front/headerLoader.js" defer></script>

<body data-page="log">
  <!-- HEADER INCLUDE -->
  <div data-include="header"></div>

  <!-- LIST BUTTON -->
  <div class="list-toggle" onclick="location.href='/archive/'" aria-label="Back to Archive list">
    <svg class="ic-list" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <main class="nw-page">
    <!-- ROOF (hhh.png) -->
    <section class="roof" aria-label="Project roof title image">
      <img src="./hhh.png" alt="NAK 낙원 WON" />
    </section>

    <!-- HERO VIDEO -->
    <section class="hero">
      <div class="hero-frame">
        <iframe
          class="hero-iframe"
          src="https://www.youtube.com/embed/fcpMGpNbylQ?rel=0&modestbranding=1"
          title="NAKWON video"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      </div>

      <div class="hero-caption">
        <p class="hero-title">꿈의 낙원 / A PARADISE OF DREAM 'NAKWON'</p>
        <span class="hero-underline" aria-hidden="true"></span>
      </div>
    </section>

    <!-- CONTENT -->
    <section class="nw-content">
      <h2>프로젝트 소개</h2>
      <p>
        낙원 프로젝트는 종로구 낙원상가를 중심으로 한 인터뷰 기반 다큐멘터리다. 노인 음악가, 상인, 그리고 이 거리를 구성하는 사람들의 목소리를 기록한다.
      </p>
      <p>
        젊은 세대가 알지 못했던 음악 문화와 장소의 기억을 영상, 인쇄물, 사진으로 남긴다.
      </p>
    </section>

    <!-- (옵션) 아래는 네가 기존에 쓰던 이미지 슬라이더 구조가 있다면 그대로 유지 가능 -->
