<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nakwon | Archive</title>
  <link rel="stylesheet" href="nakwon.css" />
</head>
<body>

<header class="header">
  <h1>낙 NAKWON 원</h1>
</header>

<main>

<!-- HERO VIDEO -->
<section class="hero">
  <div class="videoWrap">
    <iframe src="https://www.youtube.com/embed/C7ukNXUAyGQ"
      allowfullscreen></iframe>
  </div>
  <p class="heroCaption">
    꿈의 낙원 / A PARADISE OF DREAM 'NAKWON'
  </p>
</section>

<!-- DESCRIPTION -->
<section class="description">
  <h2>프로젝트 소개</h2>
  <p>
    낙원 프로젝트는 종로3가 낙원상가를 중심으로 한 인터뷰 기반 다큐멘터리다.
    노인 음악가, 상인, 그리고 이 거리를 구성하는 사람들의 목소리를 기록한다.
  </p>
  <p>
    젊은 세대가 알지 못했던 음악 문화와 장소의 기억을
    영상, 인쇄물, 사진으로 남긴다.
  </p>
</section>

<!-- SIDE MEDIA -->
<section class="sideMedia">
  <div class="audioBox">
    <p>음원 듣기</p>
    <audio controls src="assets/nakwon.mp3"></audio>
  </div>

  <div class="videoSmall">
    <iframe src="https://www.youtube.com/embed/fcpMGpNbylQ"
      allowfullscreen></iframe>
    <span>Side Music Video</span>
  </div>
</section>

<!-- PUBLICATION -->
<section class="publication">
  <h2>포스터 & 책자</h2>

  <div class="pubStage">
    <img src="assets/booklet.jpg" class="booklet" />

    <img src="assets/poster1.jpg" class="poster left" />
    <img src="assets/poster2.jpg" class="poster right" />
  </div>
</section>

<!-- PHOTO ARCHIVE -->
<section class="photos">
  <h2>사진 아카이브</h2>
  <div class="photoGrid">
    <img src="assets/photo1.jpg" />
    <img src="assets/photo2.jpg" />
    <img src="assets/photo3.jpg" />
    <img src="assets/photo4.jpg" />
    <img src="assets/photo5.jpg" />
    <img src="assets/photo6.jpg" />
  </div>
</section>

</main>

<footer class="footer">
  <p>© JUNGSI All rights reserved</p>
</footer>

<script src="nakwon.js"></script>
<script defer src="/front/favicons.js"></script>
</body>
</html>
