 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This is not a butterfly</title>

  <link rel="stylesheet" href="thisisnotabutterfly.css" />
</head>
<body>

<main class="art-page">

  <!-- FLIP CARD -->
  <div class="flip-stage">
    <div class="flip-card" id="flipCard">

      <div class="flip-inner">

        <!-- FRONT -->
        <div class="flip-face flip-front">
          <img
            src="https://pub-7ab3678ff1cb45fd9bc95ef16f0d8b39.r2.dev/archive/This%20is%20not%20a%20butterfly/%E1%84%8B%E1%85%AA%E1%86%AB%E1%84%89%E1%85%A5%E1%86%BC%E1%84%87%E1%85%A9%E1%86%AB%202.png"
            alt="This is not a butterfly – version A"
          />
        </div>

        <!-- BACK -->
        <div class="flip-face flip-back">
          <img
            src="https://pub-7ab3678ff1cb45fd9bc95ef16f0d8b39.r2.dev/archive/This%20is%20not%20a%20butterfly/OG_Moth.png"
            alt="This is not a butterfly – version B"
          />
        </div>

      </div>

      <!-- MAGNIFIER -->
      <div class="magnifier" id="magnifier"></div>

    </div>
  </div>

  <!-- INFO -->
  <section class="art-info">
    <h1 class="art-title">This is not a butterfly</h1>

    <p class="art-meta">
      Painting, Acrylic on canvas<br />
      2023
    </p>

    <p class="art-desc">
      This work presents a single painting divided into two chromatic states.
      Rather than representing difference, the split reveals how perception
      shifts when color alone is altered.
    </p>
  </section>

</main>

<script src="thisisnotabutterfly.js"></script>
</body>
</html>
