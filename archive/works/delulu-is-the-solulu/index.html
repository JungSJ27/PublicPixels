<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Desenlace in NYC | Archive</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="/front/header.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

  <meta name="theme-color" content="#010102" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#010102">

  <!-- Favicons -->
  <link rel="icon" href="/front/favicon.ico">
  <link rel="apple-touch-icon" href="/front/apple-touch-icon.png">
  <script defer src="/front/favicons.js"></script>

  <!-- Page-specific CSS -->
  <link rel="stylesheet" href="./delulu-is-the-solulu.css">
    <!-- 🔹 THREE import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>




<body data-page="log" data-no-header-offset="true">

  <!-- Header -->
  <div data-include="header"></div>
  <script src="/front/headerLoader.js" defer></script>

  <!-- List icon -->
  <div class="list-toggle" onclick="location.href='/archive/'">
    <svg viewBox="0 0 24 24" class="ic-list">
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <line x1="4" y1="6" x2="20" y2="6"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="18" x2="20" y2="18"/>
      </g>
    </svg>
  </div>

  <!-- 3D BACKGROUND -->
  <canvas id="scene"></canvas>

  <!-- VIDEO CONTENT -->
  <div class="video-wrap">
    <div class="video-box">
      <video id="player" muted playsinline preload="auto"></video>

      <div class="video-modal">
        <p id="modalText"></p>
      </div>

      <div class="caption" id="caption">1 / 2</div>
    </div>
  </div>

  <!-- PAGE SCRIPT -->
  <script type="module" src="./delulu-is-the-solulu.js"></script>
</body>

</html>
