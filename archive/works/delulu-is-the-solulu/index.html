<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Delulu is the Solulu | Archive</title>

  <!-- Header styles -->
  <link rel="stylesheet" href="/front/header.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

  <meta name="theme-color" content="#010102" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#010102">

  <!-- Favicons -->
  <link rel="icon" href="/front/favicon.ico">
  <link rel="apple-touch-icon" href="/front/apple-touch-icon.png">
  <script defer src="/front/favicons.js"></script>

  <!-- Page CSS -->
  <link rel="stylesheet" href="./delulu-is-the-solulu.css">

  <!-- Three import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- Header loader -->
  <script src="/front/headerLoader.js" defer></script>
</head>

<body data-page="log" data-no-header-offset="true">

  <!-- Header include -->
  <div data-include="header"></div>

  <!-- List icon -->
  <div class="list-toggle" onclick="location.href='/archive/'" aria-label="Back to Archive">
    <svg viewBox="0 0 24 24" class="ic-list" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <line x1="4" y1="6" x2="20" y2="6"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="18" x2="20" y2="18"/>
      </g>
    </svg>
  </div>

  <!-- 3D background -->
  <canvas id="scene"></canvas>

  <!-- Video -->
<main class="stage" aria-label="Video stage">
  <div class="video-box" id="videoBox">
    <video
      id="player"
      class="player"
      muted
      playsinline
      preload="auto"
      autoplay
    ></video>

    <!-- Description overlay -->
    <div class="video-modal" id="videoModal" aria-hidden="true">
      <div id="modalText" class="modal-text"></div>
    </div>

    <!-- Counter (영상 하단에 보이게 할 것임) -->
    <div class="caption" id="caption">1 / 2</div>
    
  </div>
</main>


  <!-- Page script -->
  <script type="module" src="./delulu-is-the-solulu.js"></script>
</body>
</html>
