<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heart Necklace</title>

  <!-- 공통 스타일 (루트에서 시작) -->
  <link rel="stylesheet" href="/front/styles.css" />
  <link rel="stylesheet" href="/front/header.css" />

  <!-- shop 공통 스타일 -->
  <link rel="stylesheet" href="../shop.css">

  <!-- PDP 전용 스타일 -->
  <link rel="stylesheet" href="./heart-necklace.css" />
</head>

<body data-page="shop">
  <!-- 공통 header / cart include -->
  <div data-include="header"></div>
  <div data-include="cart"></div>

  <main class="product-page" data-product-id="heart-necklace">
    <section id="prod-images" class="prod-images"></section>

    <section class="prod-info">
      <h1 id="prod-title"></h1>
      <p id="prod-price" class="price"></p>

      <div class="opt-block">
        <label>Color</label>
        <div id="color-area"></div>
      </div>

      <div class="opt-block">
        <label>Size</label>
        <div id="size-area"></div>
      </div>

      <div class="opt-block">
        <label>Quantity</label>
        <div class="qty-box">
          <button id="qty-minus">−</button>
          <span id="qty-num">1</span>
          <button id="qty-plus">+</button>
        </div>
      </div>

      <button id="addCartBtn" class="add-cart-btn">Add to Cart</button>

      <p id="prod-desc" class="prod-desc"></p>

      <section class="notes-wrap">
        <h3>Notes</h3>
        <ul id="notes-area"></ul>
      </section>

      <details><summary>Material</summary><p id="mat-area"></p></details>
      <details><summary>Shipping</summary><p id="ship-area"></p></details>
      <details><summary>Care</summary><p id="care-area"></p></details>
    </section>
  </main>

  <!-- 공통 JS (무조건 절대 경로로!) -->
  <script defer src="/front/favicons.js"></script>
  <script defer src="/front/headerLoader.js"></script>
  <script defer src="/front/cart.js"></script>

  <!-- PDP 전용 -->
  <script defer src="./heart-necklace.js"></script>
</body>
</html>
