<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Purchase Request</title>
  <link rel="stylesheet" href="request.css"/>
</head>

<body>

  <h1 class="page-title">Purchase Request</h1>
  <p class="page-desc">
    No payment now. We will email an invoice after confirming availability and shipping.
  </p>

  <main class="req-wrap">

    <!-- Left Items -->
    <section class="left">
      <h2>Your Items</h2>
      <div id="leftItems" class="left-box"></div>

      <h3>Billing Details</h3>

      <form id="reqForm">
        <label>Name
          <input type="text" required>
        </label>

        <label>Email
          <input type="email" required>
        </label>

        <label>Phone (optional)
          <input type="text">
        </label>

        <label>Preferred contact
          <select>
            <option>Email</option>
            <option>Phone</option>
            <option>Kakao</option>
          </select>
        </label>

        <label>Shipping address (optional)
          <input type="text">
        </label>
      </form>
    </section>

    <!-- Right Summary -->
    <aside class="right">
      <h2>Your selection</h2>

      <div id="rightList" class="sum-box"></div>

      <div class="sum-total-wrap">
        <div class="sum-label">Subtotal</div>
        <div id="sumTotal" class="sum-total"></div>
      </div>

      <p class="note">
        We will email an invoice after confirming availability and shipping.
        Submitting a request does not charge you.
      </p>

      <button id="submitBtn" class="btn-submit">Submit request</button>
      <button onclick="history.back()" class="btn-back">Back</button>
    </aside>

  </main>

  <script type="module" src="request.js"></script>
</body>
</html>
