<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/front/styles.css">
  <link rel="stylesheet" href="orderstatus.css">
</head>

<body>
  <main class="os-wrap">

    <h1>Order Status</h1>
    <p class="os-desc">Enter your Order ID to check your request.</p>

    <div class="os-form">
      <input id="orderIDinput" type="text" placeholder="PP-2025xxxx-xxxxx" />
      <button id="checkBtn">Check</button>
    </div>

    <div id="orderArea" class="order-area hidden">

      <!-- 2-Column Layout -->
      <div class="os-grid">

        <!-- LEFT ---- ORDER INFO ONLY -->
        <div class="left-col">

          <div id="orderInfoCard" class="os-card">
            <h2>Order Information</h2>
            <div id="orderInfo"></div>
          </div>

        </div>

        <!-- RIGHT ---- PROGRESS + INVOICE + SHIPPING -->
        <div class="right-col">

          <!-- Progress -->
          <div class="os-card">
            <h2>Order Progress</h2>
            <div id="statusSteps" class="status-steps">
              <div class="step" data-step="0"><span class="dot"></span> Order Received</div>
              <div class="step" data-step="1"><span class="dot"></span> Order Confirmed</div>
              <div class="step" data-step="2"><span class="dot"></span> Invoice Issued</div>
              <div class="step" data-step="3"><span class="dot"></span> Payment Completed</div>
              <div class="step" data-step="4"><span class="dot"></span> Preparing Shipment</div>
              <div class="step" data-step="5"><span class="dot"></span> Shipped</div>
              <div class="step" data-step="6"><span class="dot"></span> Delivered</div>
            </div>
          </div>

          <!-- Invoice BELOW progress -->
          <div id="invoiceCard" class="os-card sub-card">
            <h2>Invoice</h2>
            <div id="invoiceInfo"></div>
          </div>

          <!-- Shipping BELOW invoice -->
          <div id="shippingCard" class="os-card sub-card">
            <h2>Shipping Info</h2>
            <div id="shippingInfo"></div>
          </div>

        </div>

      </div>
    </div>

    <button id="backBtn" class="back-btn">Back</button>
  </main>

  <script type="module" src="orderstatus.js"></script>
</body>
</html>
