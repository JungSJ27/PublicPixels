<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="orderstatus.css">
  <script defer src="/front/favicons.js"></script>
</head>

<body>
  <main class="os-wrap">
    <h1>Order Status</h1>
    <p class="os-desc">Enter your Order ID to check your request.</p>

    <div class="os-form">
      <input id="orderIDinput" type="text" placeholder="PP-2025xxxx-xxxxx" />
      <button id="checkBtn">Check</button>
    </div>

    <div id="orderArea" class="order-area hidden">
      <!-- Order Info -->
      <div class="os-card" id="orderInfoCard">
        <h2>Order Information</h2>
        <div id="orderInfo"></div>
      </div>

      <!-- Order Progress with inline details -->
      <div class="os-card">
        <h2>Order Progress</h2>
        
        <div id="statusSteps">
        <div class="step-with-detail" data-step="0">
          <div class="step"><span class="dot"></span> Order Received</div>
        </div>

        <div class="step-with-detail" data-step="1">
          <div class="step"><span class="dot"></span> Order Confirmed</div>
        </div>

        <div class="step-with-detail" data-step="2">
          <div class="step"><span class="dot"></span> Invoice Issued</div>
          <div class="inline-detail" id="invoiceCard">
            <div id="invoiceInfo"></div>
          </div>
        </div>

        <div class="step-with-detail" data-step="3">
          <div class="step"><span class="dot"></span> Payment Completed</div>
        </div>

        <div class="step-with-detail" data-step="4">
          <div class="step"><span class="dot"></span> Preparing Shipment</div>
        </div>

        <div class="step-with-detail" data-step="5">
          <div class="step"><span class="dot"></span> Shipped</div>
          <div class="inline-detail" id="shippingCard">
            <div id="shippingInfo"></div>
          </div>
        </div>

        <div class="step-with-detail" data-step="6">
          <div class="step"><span class="dot"></span> Delivered</div>
        </div>
      </div>
    </div>

  <button id="backBtn" class="back-btn">Back to P.P. Studio</button>
  </main>

  <script type="module" src="orderstatus.js"></script>
</body>
</html>
