<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Commission</title>

  <link rel="stylesheet" href="../front/styles.css" />
  <link rel="stylesheet" href="../front/header.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./commission.css" />
  <meta name="theme-color" content="#ffffff">
</head>

<body data-page="commission">
  <div data-include="header"></div>

  <main class="page">
    <section class="toolbar" role="search">
      <input id="q" class="search" type="search" placeholder="Search title, tags" autocomplete="off" />

      <select id="tag" class="select" aria-label="Tag">
        <option value="">All</option>
      </select>

      <select id="sort" class="select" aria-label="Sort">
        <option value="new">Newest</option>
        <option value="old">Oldest</option>
        <option value="az">A to Z</option>
        <option value="za">Z to A</option>
      </select>

      <button id="reset" class="reset" type="button" aria-label="Reset filters">Reset</button>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>No results</p>

    <template id="card-tpl">
      <article class="card">
        <a class="media" href="#">
          <img class="img" alt="" loading="lazy" />
        </a>
        <div class="body">
          <h3 class="title"></h3>
          <p class="meta"></p>
        </div>
      </article>
    </template>
  </main>

  <script type="module" src="./commission.js"></script>
  <script src="../front/headerLoader.js" defer></script>
  <script defer src="/front/favicons.js"></script>
</body>
</html>
