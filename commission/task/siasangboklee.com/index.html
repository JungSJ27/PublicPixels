<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siasangbok Lee Website</title>

  <link rel="stylesheet" href="../front/styles.css" />
  <link rel="stylesheet" href="../front/header.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <link rel="stylesheet" href="./siasangboklee.css" />
  <meta name="theme-color" content="#ffffff">
</head>

<body>
  <div data-include="header"></div>

  <main class="wrap">
    <header class="top">
      <h1 class="h1">Siasangbok Lee Website</h1>
      <p class="desc">Official portfolio website for artist Siasangbok Lee.</p>

      <div class="meta">
        <span class="chip">Web</span>
        <span class="dot">•</span>
        <span>Design and development</span>
        <span class="dot">•</span>
        <span>2026</span>
      </div>

      <div class="actions">
        <a class="btn" href="https://siasangboklee.com" target="_blank" rel="noreferrer">Visit website</a>
        <a class="btn ghost" href="./" aria-label="Back to commission">Back</a>
      </div>
    </header>

    <section class="shots" aria-label="Screenshots">
      <figure class="shot">
        <img src="./assets/siasangboklee/shot1.jpg" alt="Homepage screenshot" loading="lazy">
        <figcaption>Homepage</figcaption>
      </figure>

      <figure class="shot">
        <img src="./assets/siasangboklee/shot2.jpg" alt="Works page screenshot" loading="lazy">
        <figcaption>Works archive</figcaption>
      </figure>

      <figure class="shot">
        <img src="./assets/siasangboklee/shot3.jpg" alt="Artwork detail screenshot" loading="lazy">
        <figcaption>Artwork detail</figcaption>
      </figure>

      <figure class="shot">
        <img src="./assets/siasangboklee/shot4.jpg" alt="CV and contact screenshot" loading="lazy">
        <figcaption>CV and contact</figcaption>
      </figure>
    </section>
  </main>

  <script type="module" src="./siasangboklee.js"></script>
  <script src="../front/headerLoader.js" defer></script>
  <script defer src="/front/favicons.js"></script>
</body>
</html>
