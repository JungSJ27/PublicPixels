<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SJ1</title>
  <link rel="stylesheet" href="./sj1.css" />
</head>

<body>
  <div id="stage"></div>

  <aside class="ui">
    <div class="brand">
      <div class="title">SJ1</div>
      <div class="sub">
        공동묘지를 지나 과수원으로<br />
        그리고 제일 예쁜 복숭아
      </div>
    </div>

    <div class="tabs">
      <button class="tab is-on" data-tab="chat">Talk</button>
      <button class="tab" data-tab="archive">Archive</button>
    </div>

    <section class="panel is-on" id="panel-chat">
      <div class="chatlog" id="chatlog">
        <div class="msg system">
          SJ1에 오신 걸 환영해요<br />
          복숭아 위의 휴머노이드와 대화해보세요
        </div>
      </div>

      <form class="composer" id="composer">
        <input id="chatInput" type="text" placeholder="메시지를 입력" autocomplete="off" />
        <button type="submit">Send</button>
      </form>

      <div class="hint">
        지금은 데모 UI야 나중에 API 연결하면 진짜 대화로 바뀜
      </div>
    </section>

    <section class="panel" id="panel-archive">
      <div class="cards">
        <a class="card" href="./assets/CV.pdf" target="_blank" rel="noopener">CV</a>
        <a class="card" href="./assets/ArtistStatement.pdf" target="_blank" rel="noopener">Artist Statement</a>
        <a class="card" href="./assets/childhood.jpg" target="_blank" rel="noopener">Childhood Photo</a>
        <button class="card ghost" id="btnFocusPeach">Focus Peach</button>
        <button class="card ghost" id="btnFocusModel">Focus Humanoid</button>
      </div>

      <div class="note">
        assets 폴더에 파일이 없으면 링크는 안 열릴 수 있어
      </div>
    </section>
  </aside>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./sj1.js"></script>
</body>
</html>
